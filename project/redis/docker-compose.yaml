version: "3.8"
services:
  redis_single:
    image: 'redis:7.2.0-alpine'
    restart: always
    container_name: redis_single
    hostname: redis_single
    ports:
      - "6379:6379"
  redisinsight:
    image: 'redislabs/redisinsight:1.14.0'
    container_name: redisinsight
    ports:
      - "8001:8001"
    depends_on:
      - redis_single